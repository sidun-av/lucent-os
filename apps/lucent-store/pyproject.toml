[project]
name = "lucent-store"
version = "0.1.0"
description = "Lucent OS: a calm, curated app store (Flathub apps, no recommendations)"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# lucent_migrate supplies the shared .po -> .mo writer (both live in /usr/lib/lucent).
pythonpath = [".", "tests", "../../migration-wizard"]
addopts = "-q"
