# ---------------------------------------------------------------------------
# Next generation · beta: ArtCraft (github.com/storytold, Apache-2.0).
# Installed per user by /usr/bin/lucent-nextgen from the app's GitHub
# release bundle, verified against the release's SHA256SUMS.txt AND the
# hashes pinned here. Pinned versions are the audited ones (no AI features,
# no AI libraries linked, see README "Next generation"); re-audit before
# bumping a version.
#
# Audit of 2026-11-09 (tags below): no app links craft-ai-integrations or a
# cloud AI client; all four use org.freedesktop.Platform from Flathub, get
# portals plus one or two XDG folders (no home, no host), and check GitHub
# for a newer release when they start. Not offered, because they contain
# machine learning:
#   PhotoCraft v0.22.0  local face-detection network ("Detect Faces")
#   PdfCraft v0.20.0    neural OCR models, and "AI assistant" menu entries
# The ArtCraft launcher is not offered either: it can run commands outside
# its sandbox and installs apps Lucent hasn't checked.
# ---------------------------------------------------------------------------

[[nextgen]]
key = "vectorcraft"
id = "ai.storyteller.vectorcraft"
name = "VectorCraft"
description = "Vector graphics"
repo = "storytold/vectorcraft"
version = "v0.23.0"
