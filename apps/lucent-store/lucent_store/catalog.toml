# Lucent Store catalog: everything the store shows *without* being asked.
#
# This file is the whole editorial content of the store. There is no remote
# feed, no trending list and no ranking by popularity: Home and the category
# pages show exactly these apps, in this order. Search covers all of Flathub
# (from the local AppStream data) and is the only way to reach the rest.
#
# Rules for editing:
# - English only; every user-visible string here needs a Russian translation
#   in apps/lucent-store/po/ru.po (tests/test_i18n.py checks it).
# - App ids are Flatpak application ids on Flathub (the `app/<id>/...` ref,
#   NOT the AppStream <id>, which differs for some KDE apps). Apps missing
#   on the running architecture are hidden automatically.
# - No apps whose main feature is AI, no ad-supported apps.
# - Bump `version` whenever the content changes.

schema = 1
version = "2026.11.09"

# ---------------------------------------------------------------------------
# Home: "Instead of Windows programs". One card per Windows program a
# switcher is looking for; `apps` are installed together.
# ---------------------------------------------------------------------------

[[replacement]]
windows = "Microsoft Word"
apps = ["org.onlyoffice.desktopeditors"]
name = "ONLYOFFICE Docs"
description = "Opens and saves .docx without losing formatting"
icon = "docs"

[[replacement]]
windows = "Adobe Photoshop"
apps = ["org.gimp.GIMP"]
name = "GIMP"
description = "Retouching, layers and masks; opens .psd"

[[replacement]]
