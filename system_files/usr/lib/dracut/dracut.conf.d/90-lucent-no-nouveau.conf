# Lucent: the initramfs leaves out nouveau, the open driver for NVIDIA GPUs.
#
# The image's initramfs is generic (no-hostonly: it must boot any machine),
# so it carried every GPU driver with all its firmware: 233 MB, of which
# NVIDIA's GSP firmware alone is 105 MB. Without nouveau it is 132 MB, which
# GRUB reads from /boot at every boot, dracut unpacks into RAM at every
# shutdown (dracut-shutdown.service), and every kernel update downloads.
#
# On NVIDIA machines nouveau then loads from the installed system right
# after the initramfs, and until it does the boot splash (and a disk
# encryption prompt) is drawn on the firmware's framebuffer (simpledrm).
# AMD and Intel GPUs, most machines, keep their drivers in the initramfs.
# Measurements: docs/performance.md.
omit_drivers+=" nouveau "
