# Login screen (Plasma Login Manager): the greeter account uses Lucent Dark,
# so Breeze's greeter dims the blurred Lucent wallpaper and draws white text
# (with a light scheme it brightens it to near-white). Created only if the
# greeter has no settings yet; its own later changes are kept.
d /var/lib/plasmalogin/.config 0755 plasmalogin plasmalogin -
f /var/lib/plasmalogin/.config/kdeglobals 0600 plasmalogin plasmalogin - [KDE]\nLookAndFeelPackage=org.lucent.desktop.dark\n
