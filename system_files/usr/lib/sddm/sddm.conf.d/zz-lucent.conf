# Named zz- so it is read after Fedora's plasma-wayland.conf (alphabetical order).
# Lucent login screen: SDDM with the "lucent" theme (/usr/share/sddm/themes/lucent)
# on KWin, without an on-screen keyboard. Admins override in /etc/sddm.conf.d/.
[Theme]
Current=lucent
CursorTheme=breeze_cursors
Font=Inter,11

[General]
InputMethod=

[Wayland]
# Fedora's sddm-wayland-plasma line minus "--inputmethod plasma-keyboard":
# no on-screen keyboard process and no keyboard button on the login screen.
CompositorCommand=kwin_wayland --no-global-shortcuts --no-lockscreen --locale1

[Users]
# Show only people's accounts (the installer's first user starts at 1000).
MinimumUid=1000
RememberLastUser=true
