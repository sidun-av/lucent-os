# Lucent: no on-screen keyboard on the login screen (the stock unit passes
# --inputmethod plasma-keyboard, which also shows a "Show On-Screen Keyboard"
# button). Same command line otherwise; re-check when plasma-login-manager
# changes it.
[Service]
ExecStart=
ExecStart=/usr/bin/kwin_wayland --no-lockscreen --no-global-shortcuts --no-kactivities --locale1
