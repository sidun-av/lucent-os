# An app that ignores SIGTERM at logout or shutdown is killed when its stop
# timeout runs out (user.conf.d/50-lucent-timeouts.conf: 10 s), not sent
# SIGABRT for a core dump and given another full timeout, as Fedora's
# service.d/10-timeout-abort.conf does. Measured: a Windows program left
# open (Wine's winedevice.exe ignores SIGTERM) made every reboot wait 30 s
# for it. Lucent ships no crash reporter, so those core dumps helped nobody.
# docs/performance.md.
[Service]
TimeoutStopFailureMode=kill
