# Performance (perceived): a service that hangs on shutdown makes power-off
# take up to 45 s on Fedora's default, which feels like "Windows is
# installing updates". Apps have 10 s to quit after SIGTERM, then they are
# killed (user/service.d/50-lucent-stop-kill.conf); that stays under the
# system's 15 s for the whole user session, so one stuck app can't hold the
# session past it. Data-critical services set their own TimeoutStopSec and
# are unaffected. Measured in docs/performance.md (a Windows program left
# open held every reboot for 30 s).
[Manager]
DefaultTimeoutStopSec=10s
