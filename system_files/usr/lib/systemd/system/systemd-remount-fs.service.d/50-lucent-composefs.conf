# / is a read-only composefs overlay: an /etc/fstab line for it (written by
# Anaconda before iso/lucent-apps.ks stopped it) can't be applied, and the
# service failed on every boot ("overlay: No changes allowed in
# reconfigure"). Skip it then; see /usr/libexec/lucent/remount-fs-needed.
[Service]
ExecCondition=/usr/libexec/lucent/remount-fs-needed
