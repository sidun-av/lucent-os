# Fedora 45 starts plasma-setup (KDE's first-boot wizard that creates the
# first user) on every boot until /etc/plasma-setup-done exists, even when
# the installer already created a user. Then the machine boots into a
# "Welcome to KDE Plasma / Start setup" screen instead of the login screen
# and the user would end up with a second account. Lucent runs it only when
# there is no regular user yet (e.g. an OEM-style install).
[Service]
ExecCondition=/usr/libexec/lucent/no-regular-users
