# mcelog supports Intel CPUs only: on every current AMD CPU (family 17h and
# later) it exits with "mcelog does not support this processor. Please use
# the edac_mce_amd module instead" (the kernel already loads that), leaving
# a failed unit on every boot. Skip it there instead of failing.
[Service]
ExecCondition=/usr/bin/grep -q GenuineIntel /proc/cpuinfo
