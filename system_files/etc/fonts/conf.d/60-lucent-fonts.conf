<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Lucent fonts.
     - Figtree (/usr/share/fonts/figtree) is the Plasma UI font in languages it
       covers (kdeglobals, lucent-theme font). It has Latin only, so any other
       script inside a Figtree session (a Cyrillic file name, a Greek title)
       falls back to Inter first, which has Latin, Cyrillic, Greek and
       Vietnamese, before the generic sans-serif chain.
     - Inter is the default sans-serif for non-KDE apps that ask fontconfig
       directly (web pages, GTK apps without a configured font): it covers the
       scripts of every language Lucent's installer offers.
     - JetBrains Mono for monospace. -->
<fontconfig>
  <alias binding="same">
    <family>Figtree</family>
    <accept><family>Inter</family></accept>
  </alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
