name: vm

# TEST-ONLY VM disk images (qcow2) of the published image, for booting
# Lucent OS locally with tools/vm/. They differ from a release install:
# a `lucent` user with a known password and SSH key, sshd on, SDDM
# autologin, Russian locale (see tools/vm/image/). Release images and the
# ISO never get any of this; the derived image is built here and not pushed.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options: [arm64, amd64, both]
        default: arm64

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lucent-os

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arches:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          case "${{ inputs.arch || 'arm64' }}" in
            arm64) a='["arm64"]' ;;
            amd64) a='["amd64"]' ;;
            both)  a='["arm64","amd64"]' ;;
          esac
          echo "matrix=$a" >> "$GITHUB_OUTPUT"

  qcow2:
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils ntfs-3g
          command -v podman || sudo apt-get install -y -qq podman
      - name: Build the test-only derived image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman build --pull=newer --build-arg IMAGE="$IMAGE:latest" \
            -t localhost/lucent-vmtest:latest tools/vm/image
          sudo podman image inspect "$IMAGE:latest" --format '{{index .Labels "org.opencontainers.image.revision"}}' | tee image-revision.txt
      - name: bootc-image-builder (qcow2)
        run: |
          key=$(cat tools/vm/image/lucent_vm_ed25519.pub)
          sed "s|@SSH_KEY@|$key|" tools/vm/image/config.toml.in > config.toml
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs \
            localhost/lucent-vmtest:latest
          sudo find output -type f -exec ls -la {} +
      - name: Compress and package
        run: |
          name=lucent-os-vm-${{ matrix.arch }}
          mkdir "$name"
          sudo qemu-img convert -p -c -O qcow2 -o compression_type=zstd output/qcow2/disk.qcow2 "$name/lucent-${{ matrix.arch }}.qcow2"
          sudo rm -rf output
          sudo tools/vm/image/make-windows-disk.sh "$name/windows-disk.qcow2"
          cp image-revision.txt "$name/"
          sudo chown -R "$USER" "$name"
          (cd "$name" && sha256sum *.qcow2 > SHA256SUMS)
          ls -la "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: lucent-os-vm-${{ matrix.arch }}
          path: lucent-os-vm-${{ matrix.arch }}
          compression-level: 0
          retention-days: 7
