name: iso

# Builds an installable Anaconda ISO from the published image, with Lucent's
# default apps on the media so they are installed offline, before the first
# login (iso/lucent-apps.ks). Manual, or called by the release workflow: it
# takes a while and produces a multi-GB artifact.
#
# The installed system follows the image tag the ISO was built from
# (bootc-image-builder writes it into the new system's origin): `latest` for
# test ISOs, `stable` for releases.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
      install_test:
        description: "Unattended, offline install of the ISO in QEMU/KVM, then check the apps on the disk (amd64 only)"
        type: boolean
        default: true
      image_tag:
        description: "Image tag to install, and to follow for updates (latest, testing, stable)"
        type: string
        default: latest
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      install_test:
        type: boolean
        default: true
      image_tag:
        type: string
        default: latest

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lucent-os
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/lucent-os:${{ inputs.image_tag || 'latest' }}
  FEDORA: quay.io/fedora/fedora:45
  WORK: /mnt/lucent-iso

jobs:
  iso:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt
      - name: Install podman if missing
        run: command -v podman || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The multi-arch tag, so the installed system keeps following it
          # for its atomic updates.
          sudo podman pull "$IMAGE_REF"
          sudo podman image inspect "$IMAGE_REF" --format '{{index .Labels "org.opencontainers.image.revision"}}' | tee image-revision.txt

      - name: Offline app bundle (Flathub apps + runtimes as a ready /var/lib/flatpak)
        env:
          LUCENT_BUNDLE_COMPARE: "1"
        run: |
          # --privileged: flatpak runs its install triggers (icon/desktop caches) in bwrap.
          start=$(date +%s)
          sudo podman run --rm --privileged -e LUCENT_BUNDLE_COMPARE -v "$PWD:/src:ro" -v "$WORK:/out" "$FEDORA" /src/iso/build-app-bundle.sh /out
          echo "bundle took $(( $(date +%s) - start )) s"
      - name: Check the bundle offline in the Lucent image
        run: |
          sudo podman run --rm --network none -v "$PWD:/src:ro" -v "$WORK:/out:ro" "$IMAGE_REF" \
            /src/iso/check-app-bundle.sh /out

      - name: bootc-image-builder (anaconda-iso)
        run: |
          python3 iso/make-config.py config.toml
          cat config.toml
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./config.toml:/config.toml:ro \
            -v "$WORK/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            "$IMAGE_REF"
          sudo find "$WORK/output" -type f -exec ls -la {} +
      - name: Recompress the system image on the ISO (gzip to zstd) and add the app bundle
        run: |
          iso="lucent-os-${{ inputs.arch }}.iso"
          # 1. The system image on the ISO (/container, an OCI layout) gets
          #    zstd -19 layers instead of gzip. iso/zstd-oci.py checks each
          #    layer's content against its diff_id: only the compression
          #    changes. The installer (ostree-container) reads both.
          # 2. A new ISO from the old one: xorriso replays its boot records
          #    (El Torito, hybrid MBR/GPT, the EFI partition), swaps /container
          #    and adds /lucent-apps; then the media checksum is implanted
          #    again. The boot configuration is unchanged, so no efiboot
          #    rebuild (as `mkksiso --skip-mkefiboot -a` did, plus the swap).
          sudo podman run --rm -v "$WORK:/work" -v "$PWD:/src:ro" "$FEDORA" bash -euc '
            dnf -y -q --setopt=install_weak_deps=False install xorriso isomd5sum zstd pigz python3 >/dev/null
            in=/work/output/bootiso/install.iso
            osirrox -indev "$in" -extract /container /work/container 2>/dev/null
            chmod -R u+w /work/container
            du -sb /work/container | cut -f1 > /work/container-gzip.txt
            start=$(date +%s)
            python3 /src/iso/zstd-oci.py /work/container | tail -n 2
            echo "recompression took $(( $(date +%s) - start )) s"
            du -sb /work/container | cut -f1 > /work/container-zstd.txt
            xorriso -indev "$in" -outdev /work/'"$iso"' -boot_image any replay \
              -rm_r /container -- \
              -map /work/container /container \
              -map /work/lucent-apps /lucent-apps
            implantisomd5 /work/'"$iso"'
            xorriso -indev /work/'"$iso"' -report_el_torito plain -report_system_area plain 2>/dev/null | head -n 40'
          base=$(sudo stat -c %s "$WORK/output/bootiso/install.iso")
          sudo rm -rf "$WORK/output" "$WORK/container"
          sudo mv "$WORK/$iso" "$iso"
          sudo chown "$USER" "$iso"
          sha256sum "$iso" | tee "$iso.sha256"
          final=$(stat -c %s "$iso")
          read -r _ installed < <(grep installed_bytes "$WORK/lucent-apps/sizes.txt")
          read -r _ packed < <(grep packed_bytes "$WORK/lucent-apps/sizes.txt")
          gb() { awk -v b="$1" 'BEGIN { printf "%.2f GB", b / 1e9 }'; }
          {
            echo "### ISO size (${{ inputs.arch }}, $IMAGE_REF, image $(cat image-revision.txt))"
            echo "| | size |"
            echo "|---|---|"
            echo "| ISO from bootc-image-builder | $(gb "$base") |"
            echo "| system image on it (/container), gzip layers | $(gb "$(cat "$WORK/container-gzip.txt")") |"
            echo "| system image, recompressed (zstd -19) | $(gb "$(cat "$WORK/container-zstd.txt")") |"
            echo "| default apps installed (/var/lib/flatpak) | $(gb "$installed") |"
            echo "| app bundle on the ISO (zstd -19, sorted) | $(gb "$packed") |"
            if [ -f "$WORK/bundle-compare.txt" ]; then
              read -r _ previous < "$WORK/bundle-compare.txt"
              echo "| app bundle, previous packing (zstd -12, plain order) | $(gb "$previous") |"
            fi
            echo "| **final ISO** | **$(gb "$final")** |"
            echo
            echo '```'
            cat "$WORK/lucent-apps/apps.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lucent-os-${{ inputs.arch }}-iso
          path: |
            lucent-os-${{ inputs.arch }}.iso
            lucent-os-${{ inputs.arch }}.iso.sha256
          compression-level: 0
          retention-days: 14

      # ---- Install test: the real Anaconda, no network, then look at the disk ----
      - name: Install test - prepare an unattended copy of the ISO
        if: inputs.install_test && inputs.arch == 'amd64'
        run: |
          sudo rm -rf "$WORK/lucent-apps"
          sudo podman rmi -a -f >/dev/null || true
          # Same media; the kickstart only adds what an unattended run needs
          # and then %includes the ISO's own (which carries lucent-apps.ks).
          cat > "$WORK/test.ks" <<'EOF'
          %include /run/install/repo/osbuild.ks
          text --non-interactive
          lang en_US.UTF-8
          keyboard us
          timezone UTC --utc
          zerombr
          clearpart --all --initlabel --disklabel=gpt
          autopart --noswap --type=plain --fstype=ext4
          rootpw --lock
          poweroff
          EOF
          sudo podman run --rm --privileged -v "$WORK:/work" -v "$PWD:/src:ro" "$FEDORA" bash -euc '
            dnf -y -q --setopt=install_weak_deps=False install lorax xorriso isomd5sum dosfstools mtools >/dev/null
            mkksiso --no-md5sum --ks /work/test.ks -c "console=ttyS0,115200 inst.notmux" \
              /src/lucent-os-${{ inputs.arch }}.iso /work/test.iso'
          df -h "$WORK"
      - name: Install test - run Anaconda in QEMU (KVM, no network)
        if: inputs.install_test && inputs.arch == 'amd64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs attr >/dev/null
          sudo chmod 666 /dev/kvm
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$WORK/vars.fd"
          truncate -s 40G "$WORK/disk.raw"
          start=$(date +%s)
          timeout 75m qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 6144 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$WORK/vars.fd" \
            -drive file="$WORK/disk.raw",format=raw,if=virtio \
            -drive file="$WORK/test.iso",media=cdrom,readonly=on \
            -boot order=d -nic none -display none -no-reboot \
            -serial file:"$WORK/serial.log"
          echo "install took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -a 'lucent-apps\|unpacking\|default apps\|bundle' "$WORK/serial.log" || true
          tail -n 40 "$WORK/serial.log"
      - name: Install test - check the apps on the installed disk
        if: inputs.install_test && inputs.arch == 'amd64'
        run: |
          loop=$(sudo losetup -fP -r --show "$WORK/disk.raw")
          sudo lsblk -o NAME,SIZE,FSTYPE "$loop"
          sudo mkdir -p /mnt/inst
          root=""
          for p in "$loop"p*; do
            sudo mount -o ro "$p" /mnt/inst 2>/dev/null || continue
            if sudo test -d /mnt/inst/ostree/deploy; then root=$p; break; fi
            sudo umount /mnt/inst
          done
          [ -n "$root" ] || { echo "no ostree root on the installed disk"; exit 1; }
          var=$(sudo find /mnt/inst/ostree/deploy -mindepth 2 -maxdepth 2 -name var -type d | head -n1)
          echo "stateroot var: $var"
          sudo cat "$var/log/lucent/apps-install.log" || true
          sudo find /mnt/inst -xdev \( -name 'apps-install.log' -o -name 'lucent-apps.log' -o -name 'ks-script-*' \) -print 2>/dev/null | head -20
          sudo find /mnt/inst -xdev -maxdepth 9 -type d -path '*/lib/flatpak/app' -print 2>/dev/null
          # (data must not end up in the deployment's own, unused /var)
          sudo sh -c 'ls -d /mnt/inst/ostree/deploy/*/deploy/*/var/lib/flatpak/app 2>/dev/null' && echo "WARNING: apps in the deployment /var"
          fail=0
          while read -r app; do
            if sudo test -d "$var/lib/flatpak/app/$app"; then echo "ok      $app"; else echo "MISSING $app"; fail=1; fi
          done < <(grep -Ev '^\s*(#|$)' system_files/usr/share/lucent/flatpaks.list)
          sudo ls "$var/lib/flatpak/runtime"
          # Unpacked files must carry real SELinux labels, not unlabeled_t.
          f=$(sudo find "$var/lib/flatpak/app" -type f -name metadata | head -n1)
          label=$(sudo getfattr --only-values -n security.selinux "$f" 2>/dev/null | tr -d '\0' || true)
          echo "SELinux label of $f: ${label:-none}"
          if sudo test -e "$var/lib/lucent/relabel-flatpak"; then
            label="deferred to first boot (lucent-flatpak-relabel.service)"
          else
            case "$label" in ""|*unlabeled_t*) echo "not labelled"; fail=1 ;; esac
          fi
          { echo "### Install test"; echo "apps on disk: $(sudo ls "$var/lib/flatpak/app" | wc -l), label: ${label:-none}"; } >> "$GITHUB_STEP_SUMMARY"
          sudo umount /mnt/inst
          sudo losetup -d "$loop"
          exit $fail
      - name: Install test - logs
        if: always() && inputs.install_test && inputs.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: install-test-serial-log
          path: ${{ env.WORK }}/serial.log
          if-no-files-found: ignore
          retention-days: 7
