name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: pick up Fedora security/bug-fix updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lucent-os

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt runtime libraries for the offscreen GUI smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pytest PySide6
      - name: pytest (migration wizard)
        working-directory: migration-wizard
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (base image + Wine is ~6 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Install podman if missing
        run: command -v podman || (sudo apt-get update -qq && sudo apt-get install -y -qq podman)
      - name: Build
        run: |
          sudo podman build --pull=newer \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ matrix.arch }}" -f Containerfile .
          sudo podman images
      - name: Smoke test (Windows apps, units, rules) inside the built image
        run: sudo podman run --rm -v ./build_files:/t:ro "$IMAGE:${{ matrix.arch }}" /t/smoke-test.sh
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag "$IMAGE:${{ matrix.arch }}" "$IMAGE:latest-${{ matrix.arch }}" "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          sudo podman push "$IMAGE:latest-${{ matrix.arch }}"
          sudo podman push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish multi-arch :latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest ${{ github.sha }}; do
            podman manifest create "lucent:$tag"
            podman manifest add "lucent:$tag" "docker://$IMAGE:${{ github.sha }}-amd64"
            podman manifest add "lucent:$tag" "docker://$IMAGE:${{ github.sha }}-arm64"
            podman manifest push --all "lucent:$tag" "docker://$IMAGE:$tag"
          done
